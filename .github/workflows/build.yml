name: Build WCompiler

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# ── Linux build ────────────────────────────────────────────────────────────────
# Uses system GCC (no bundled toolchain). User installs gcc via package manager
# on first run if not already present.
jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Build (Linux — download toolchain on first run)
        run: npx tauri build
        # No --features bundled-toolchain: Linux detects system gcc.

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wcompiler-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  # ── Windows build ───────────────────────────────────────────────────────────
  # Downloads MinGW-w64 portable during CI, bundles it into app resources.
  # End users get a self-contained installer: no internet required at runtime.
  build-windows:
    runs-on: windows-latest
    env:
      MINGW_TAG:      "14.2.0posix-19.1.1-12.0.0-ucrt-r2"
      MINGW_FILENAME: "winlibs-x86_64-posix-seh-gcc-14.2.0-mingw-w64ucrt-12.0.0-r2.zip"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      # ── Download MinGW-w64 and embed into resources ─────────────────────────
      - name: Download MinGW-w64 portable
        shell: pwsh
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/$env:MINGW_TAG/$env:MINGW_FILENAME"
          $dest = "src-tauri/resources/toolchain/mingw64.zip"
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/toolchain" | Out-Null
          Write-Host "Downloading MinGW from: $url"
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
          Write-Host "Download complete. Size: $((Get-Item $dest).Length / 1MB) MB"

      - name: Compute and save SHA-256
        shell: pwsh
        run: |
          $zip = "src-tauri/resources/toolchain/mingw64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          Write-Host "SHA-256: $hash"
          Set-Content -Path "src-tauri/resources/toolchain/mingw64.zip.sha256" -Value $hash
          # Also write into cpp.rs so the Rust code has the real hash at compile time
          # (optional hardening — the runtime verifier uses the .sha256 sidecar file)
          echo "MINGW_SHA256=$hash" >> $env:GITHUB_ENV

      # ── Tell Tauri to include resources/toolchain/ in the bundle ───────────
      - name: Patch tauri.conf.json to include toolchain resources
        shell: pwsh
        run: |
          $conf = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          # Add resources entry if not present
          if (-not $conf.bundle.PSObject.Properties['resources']) {
            $conf.bundle | Add-Member -Name 'resources' -Value @() -MemberType NoteProperty
          }
          # Ensure our toolchain zip is included
          $entry = @{ src = "resources/toolchain/mingw64.zip"; target = "toolchain/mingw64.zip" }
          $sha_entry = @{ src = "resources/toolchain/mingw64.zip.sha256"; target = "toolchain/mingw64.zip.sha256" }
          $conf.bundle.resources = @($entry, $sha_entry)
          $conf | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json"
          Write-Host "tauri.conf.json updated with toolchain resources"

      - name: Build (Windows — bundled MinGW, no download required at runtime)
        run: npx tauri build -- --features bundled-toolchain

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wcompiler-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # ── GitHub Release ──────────────────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: wcompiler-linux
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: wcompiler-windows
          path: artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/**
            artifacts/windows/**
          generate_release_notes: true
          body: |
            ## WCompiler

            ### Windows
            - **Bundled C/C++ compiler** — MinGW-w64 GCC 14.2.0 included.
              No internet connection required. Install and run immediately.

            ### Linux
            - Detects system `gcc`/`g++` automatically.
              If not found, the app will guide you through installation.
