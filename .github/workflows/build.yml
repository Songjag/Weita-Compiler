name: Build WCompiler (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# ── Windows build ───────────────────────────────────────────────────────────────
# Downloads MinGW-w64 portable during CI, bundles it into the installer.
# End users get a self-contained .exe / .msi — no internet required at runtime.
jobs:
  build-windows:
    runs-on: windows-latest
    env:
      MINGW_TAG:      "14.2.0posix-19.1.1-12.0.0-ucrt-r2"
      MINGW_FILENAME: "winlibs-x86_64-posix-seh-gcc-14.2.0-mingw-w64ucrt-12.0.0-r2.zip"

    steps:
      - uses: actions/checkout@v4

      # ── Tooling ─────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable, MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Separate cache key for the bundled build so it doesn't collide
          # with a hypothetical non-bundled dev build.
          key: windows-bundled

      - name: Install npm dependencies
        run: npm ci

      # ── Bundle MinGW-w64 ────────────────────────────────────────────────────
      - name: Download MinGW-w64 portable archive
        shell: pwsh
        run: |
          $url  = "https://github.com/brechtsanders/winlibs_mingw/releases/download/$env:MINGW_TAG/$env:MINGW_FILENAME"
          $dest = "src-tauri/resources/toolchain/mingw64.zip"
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/toolchain" | Out-Null
          Write-Host "Downloading: $url"
          # Use .NET HttpClient for progress-friendly, reliable download
          $client = [System.Net.WebClient]::new()
          $client.DownloadFile($url, (Resolve-Path "src-tauri/resources/toolchain").Path + "\mingw64.zip")
          $sizeMB = [math]::Round((Get-Item $dest).Length / 1MB, 1)
          Write-Host "Downloaded $sizeMB MB"

      - name: Compute SHA-256 and write sidecar
        id: sha256
        shell: pwsh
        run: |
          $zip  = "src-tauri/resources/toolchain/mingw64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          Write-Host "SHA-256: $hash"
          Set-Content -Path "src-tauri/resources/toolchain/mingw64.zip.sha256" -Value $hash -NoNewline
          echo "hash=$hash" >> $env:GITHUB_OUTPUT

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build Tauri app (bundled MinGW)
        shell: pwsh
        env:
          # Surface the hash in build logs for traceability
          MINGW_SHA256: ${{ steps.sha256.outputs.hash }}
        run: |
          # Tauri --config merges with tauri.conf.json at build time.
          # Map syntax: { "src": "target/in/bundle" } (Tauri 2 resources format)
          $resources = @{
            "resources/toolchain/mingw64.zip"        = "toolchain/mingw64.zip"
            "resources/toolchain/mingw64.zip.sha256" = "toolchain/mingw64.zip.sha256"
          } | ConvertTo-Json -Compress
          $config = "{`"bundle`":{`"resources`":$resources}}"
          Write-Host "Tauri config override: $config"
          npx tauri build --config $config -- --features bundled-toolchain

      # ── Artefacts ────────────────────────────────────────────────────────────
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: wcompiler-windows-${{ github.ref_name }}
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artefacts
        uses: actions/download-artifact@v4
        with:
          name: wcompiler-windows-${{ github.ref_name }}
          path: artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/windows/**
          body: |
            ## WCompiler ${{ github.ref_name }} — Windows

            **Bundled C/C++ compiler** (MinGW-w64 GCC 14.2.0 · UCRT · POSIX threads)

            No internet connection required after installation.
            Install the `.exe` (NSIS) or `.msi` and start coding immediately.
