[package]
name = "wcompiler"
version = "0.1.0"
description = "Local C/C++ IDE - OneCompiler inspired"
authors = ["LocalCompiler"]
edition = "2021"

# Prevent binary from being called "main" on Windows
default-run = "wcompiler"

[[bin]]
name = "wcompiler"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
dirs = "5"
which = "6"
zip = "2"
tar = "0.4"
xz2 = "0.1"
flate2 = "1"
bzip2 = "0.4"
tempfile = "3"
futures-util = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
# Bundle MinGW toolchain into the app resources (Windows-only build variant).
# When enabled: first-run extracts the bundled toolchain, no internet required.
# When disabled: toolchain is downloaded on first run (default Linux behavior).
bundled-toolchain = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
